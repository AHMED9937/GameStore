# Railway — Nest API (DEPLOYMENT_PLAN.md slice D2)
# Root Directory = monorepo root (not apps/api).
# Set variables from .env.staging in the Railway dashboard (never commit secrets).
#
# Use one service for the Nest API. Do not create per-package services
# (e.g. @gamestore/api/data-access) — those are libraries, not deployables.

[build]
builder = "NIXPACKS"
# Generate Prisma client before Nx so api-prisma:build never typechecks a missing client.
# Serial Nx build: exit 130 on Railway is usually SIGINT from OOM under parallel graph.
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && NX_DAEMON=false NX_PARALLEL=1 NX_TUI=false NODE_OPTIONS=--max-old-space-size=3072 pnpm nx build api --parallel=1"

[deploy]
releaseCommand = "pnpm db:migrate"
startCommand = "node dist/apps/api/main.js"
healthcheckPath = "/api/health/db"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
