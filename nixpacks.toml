# Nixpacks settings for Railway Nest API deploys (pnpm monorepo).
# Force the Node provider so monorepo apps/web (Next.js) is not treated as the app.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_PRODUCTION = "false"
NX_DAEMON = "false"
NX_PARALLEL = "1"
NX_TUI = "false"
NODE_OPTIONS = "--max-old-space-size=3072"
