name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify deployment configs
        run: |
          pnpm run deploy:vercel-config:test
          pnpm run deploy:railway-config:test

      - name: Run Nx lint and build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm nx affected -t lint build --base=origin/main --head=HEAD --parallel=1
          else
            pnpm nx affected -t lint build --base=HEAD~1 --head=HEAD --parallel=1
          fi
        env:
          NX_DAEMON: 'false'
          NX_CLOUD: 'false'
